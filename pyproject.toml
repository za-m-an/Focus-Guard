[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "focusguard"
version = "1.0.0"
description = "DietPi Network-Wide FocusGuard Distraction Blocking System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "FocusGuard Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
focusguard = "focusguard.cli.main:main"
focusguardd = "focusguard.service.daemon:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
